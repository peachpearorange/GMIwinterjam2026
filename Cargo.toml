[package]
name = "winterjam2026"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["free_camera", "serialize", "wav"] }
bevy_egui = { version = "0.43.1", optional = true }
image = "0.25.10"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

[build-dependencies]
ron = "0.12.3"

[features]
default = ["editor"]
# The content editor, built into the game. Leave it out of releases with
# `cargo build --release --no-default-features`.
editor = ["dep:bevy_egui"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
