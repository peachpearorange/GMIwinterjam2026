[package]
name = "winterjam2026"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["free_camera", "serialize", "wav"] }
bevy_egui = { version = "0.43.1", optional = true }
image = "0.25.10"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
bevy_mod_openxr = { path = "vendor/bevy_oxr/crates/bevy_openxr", optional = true, features = ["window_support"] }
bevy_mod_xr = { path = "vendor/bevy_oxr/crates/bevy_xr", optional = true }
openxr = { version = "0.21.1", optional = true }
# Bevy's own, for its raw keyboard events.
winit = { version = "0.30", default-features = false }

# On the web, music plays in the page, through these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlAudioElement", "HtmlMediaElement"] }

[build-dependencies]
ron = "0.12.3"

[features]
default = ["vr"]
# The content editor, built into the game. Leave it out of releases with
# `cargo build --release --no-default-features`.
editor = ["dep:bevy_egui"]
# Edit in a VR headset through OpenXR (e.g. WiVRn streaming to a Pico 4).
# On by default: "Activate VR" in the editor restarts into WiVRn (see .cargo/config.toml).
vr = ["editor", "dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The web build for itch.io: `cargo build --profile web --no-default-features
# --target wasm32-unknown-unknown`. Smaller than release, for a quicker download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = true
