[package]
name = "winterjam2026"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["free_camera", "serialize", "wav"] }
bevy_egui = { version = "0.43.1", optional = true }
image = "0.25.10"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
bevy_mod_openxr = { path = "vendor/bevy_oxr/crates/bevy_openxr", optional = true, features = ["window_support"] }
bevy_mod_xr = { path = "vendor/bevy_oxr/crates/bevy_xr", optional = true }
openxr = { version = "0.21.1", optional = true }

[build-dependencies]
ron = "0.12.3"

[features]
default = ["editor"]
# The content editor, built into the game. Leave it out of releases with
# `cargo build --release --no-default-features`.
editor = ["dep:bevy_egui"]
# Edit in a VR headset through OpenXR (e.g. WiVRn streaming to a Pico 4).
# `cargo run --features vr`
vr = ["editor", "dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
