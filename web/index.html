<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Jam 2026</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  /* Shown while the game downloads, until Bevy adds its canvas. */
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #loading div { width: 48px; height: 48px; border: 4px solid #fff3; border-top-color: #fff;
                 border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div></div></div>
<script>
  // Browsers start audio muted until the player clicks or presses a key. Keep every
  // AudioContext the game makes and resume them all on the first such input.
  (() => {
    const contexts = [];
    const Original = window.AudioContext || window.webkitAudioContext;
    if (!Original) return;
    window.AudioContext = window.webkitAudioContext = new Proxy(Original, {
      construct(target, args) { const context = new target(...args); contexts.push(context); return context; }
    });
    const resume = () => contexts.forEach(context => context.state !== "running" && context.resume());
    ["pointerdown", "keydown", "touchstart"].forEach(event => document.addEventListener(event, resume, true));
  })();
  // Browsers only go fullscreen in answer to a click or key press: a click goes
  // fullscreen whenever it isn't, as it also takes the mouse back, and F goes in or out.
  (() => {
    const page = document.documentElement;
    // Going fullscreen uses up the click, so the game's own request to hold the mouse,
    // which comes a moment later, would fail: hold it here first, on the same click,
    // and again once fullscreen in case going fullscreen let it go.
    const holdMouse = () => {
      const canvas = document.querySelector("canvas");
      if (canvas && document.pointerLockElement !== canvas) {
        Promise.resolve(canvas.requestPointerLock?.()).catch(() => {});
      }
    };
    const enter = () => !document.fullscreenElement && page.requestFullscreen?.().catch(() => {});
    document.addEventListener("pointerdown", () => { holdMouse(); enter(); }, true);
    document.addEventListener("fullscreenchange", () => document.fullscreenElement && holdMouse());
    document.addEventListener("keydown", event => {
      if (event.code !== "KeyF" || event.repeat) return;
      if (document.fullscreenElement) document.exitFullscreen?.(); else enter();
    }, true);
  })();
  // Hide the spinner once Bevy has put its canvas in the page.
  new MutationObserver((_, observer) => {
    if (document.querySelector("canvas")) { document.getElementById("loading").remove(); observer.disconnect(); }
  }).observe(document.body, { childList: true });
</script>
<script type="module">
  import init from "./game.js";
  init().catch(error => {
    // Bevy leaves the event loop by throwing; that's not a failure.
    if (!String(error).includes("Using exceptions for control flow")) throw error;
  });
</script>
</body>
</html>
